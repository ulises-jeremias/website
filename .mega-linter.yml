# MegaLinter configuration — Astro personal website
# https://megalinter.io/latest/config-file/

FILTER_REGEX_EXCLUDE: >-
  (\.git/|node_modules/|\.astro/|dist/|build/|coverage/|pnpm-lock\.yaml|docs/design/art-directions/.+\.html|docs/design/baselines/.+\.(png|jpg|jpeg|webp))

# Self-contained art-direction prototypes intentionally use inline CSS (<style>).
HTML_DJLINT_FILTER_REGEX_EXCLUDE: (docs/design/art-directions/)

COPYPASTE_JSCPD_ARGUMENTS: '--min-lines 20 --min-tokens 150 --threshold 5'

CSS_STYLELINT_CONFIG_FILE: .stylelintrc.json
SPELL_CSPELL_CONFIG_FILE: cspell.json
REPOSITORY_GRYPE_DISABLE_ERRORS: true
REPOSITORY_TRIVY_DISABLE_ERRORS: true

# Disable formatters already covered by Prettier/ESLint to avoid conflicts
DISABLE_LINTERS:
  - TYPESCRIPT_ES
  - JAVASCRIPT_ES
  - TYPESCRIPT_STANDARD
