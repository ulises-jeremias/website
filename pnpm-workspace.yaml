packages:
  - '.'

# Lighthouse's browser data can publish multiple times per day. Keep Dependabot
# updates usable while its injected three-day maturity gate protects all other packages.
minimumReleaseAgeExclude:
  - web-features

patchedDependencies:
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
