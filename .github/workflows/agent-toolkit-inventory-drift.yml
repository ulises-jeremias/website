name: Agent Toolkit inventory drift

on:
  schedule:
    - cron: '47 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-toolkit-inventory-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Detect Agent Toolkit inventory drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout agent-toolkit main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ulises-jeremias/agent-toolkit
          ref: main
          path: agent-toolkit
          persist-credentials: false

      - name: Regenerate inventory snapshot from upstream
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          AGENT_TOOLKIT_ROOT="$GITHUB_WORKSPACE/agent-toolkit" \
            python3 scripts/sync-agent-toolkit-inventory.py

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- src/features/agent-toolkit/data/inventory.snapshot.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Inventory snapshot is up to date with upstream main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Agent Toolkit inventory drift detected"
              echo '```'
              git diff --stat -- src/features/agent-toolkit/data/inventory.snapshot.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git diff -- src/features/agent-toolkit/data/inventory.snapshot.json > inventory-drift.diff
          fi

      - name: Upload drift diff
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventory-drift-diff
          path: inventory-drift.diff
          retention-days: 14

      - name: Open generated-data PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/agent-toolkit-inventory-drift"
          stamp="$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add src/features/agent-toolkit/data/inventory.snapshot.json
          git commit -m "chore(data): refresh Agent Toolkit inventory snapshot ($stamp)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          # Reuse an existing open drift PR instead of stacking branches.
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number' || true)"
          body="$(mktemp)"
          cat > "$body" <<EOF
          ## Generated data refresh

          The committed Agent Toolkit inventory snapshot drifted from upstream
          [\`ulises-jeremias/agent-toolkit@main\`](https://github.com/ulises-jeremias/agent-toolkit/commits/main).

          - Regenerated by \`scripts/sync-agent-toolkit-inventory.py\` (scheduled drift workflow)
          - Source commit: $(python3 -c "import json;print(json.load(open('src/features/agent-toolkit/data/inventory.snapshot.json'))['commitFull'])")
          - Source version: $(python3 -c "import json;print(json.load(open('src/features/agent-toolkit/data/inventory.snapshot.json'))['version'])")

          Review the diff, confirm the claims render correctly (\`/agent-toolkit\`), and merge.
          CI on this PR validates the generated data. Do not edit the snapshot by hand.
          EOF

          if [ -n "$existing" ]; then
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              --force "HEAD:refs/heads/${branch}"
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --title "chore(data): refresh Agent Toolkit inventory snapshot ($stamp)" \
              --body-file "$body" \
              --head "$branch" \
              --base main
          fi
