name: Open Source evidence refresh

on:
  schedule:
    - cron: '11 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-source-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh committed evidence cache and open a PR on change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh evidence cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm data:refresh

      - name: Detect cache change
        id: drift
        run: |
          if git diff --quiet -- src/data/generated/github-evidence.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Evidence cache is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Open Source evidence changed"
              echo '```'
              git diff --stat -- src/data/generated/github-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open generated-data PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/github-evidence-refresh"
          stamp="$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add src/data/generated/github-evidence.json
          git commit -m "chore(data): refresh Open Source evidence cache ($stamp)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number' || true)"
          body="$(mktemp)"
          cat > "$body" <<EOF
          ## Generated data refresh

          The committed Open Source evidence cache changed upstream
          (repository activity, releases, or maintenance status).

          - Regenerated by \`pnpm data:refresh\` (scheduled evidence-refresh workflow)
          - Policy: \`docs/DATA_PROVENANCE.md\` — no stars/vanity metrics are written;
            volatile rows carry fresh \`verifiedAt\` dates.

          Review the diff on \`/open-source\` and merge. Do not edit the cache by hand.
          EOF

          if [ -n "$existing" ]; then
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              --force "HEAD:refs/heads/${branch}"
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --title "chore(data): refresh Open Source evidence cache ($stamp)" \
              --body-file "$body" \
              --head "$branch" \
              --base main
          fi
