name: Todo Checker

on:
  # Run this workflow on push to main
  push:
    branches:
      - main

# Restrict default permissions for all jobs (CKV2_GHA_1)
permissions: {}

jobs:
  todo:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Begin CI...
        uses: actions/checkout@v7

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5.1.15
        id: todo
        with:
          INSERT_ISSUE_URLS: 'false'
          CLOSE_ISSUES: 'true'
